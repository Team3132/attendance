[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.0", features = [] }

[dependencies]
serde_json = "=1.0.149"
serde = { version = "=1.0.228", features = ["derive"] }
log = "=0.4.29"
tauri = { version = "=2.11.0", features = ["devtools"] }
tauri-plugin-log = "=2.8.0"
tauri-plugin-store = "=2.4.2"
tauri-plugin-deep-link = "=2.4.7"
tauri-plugin-opener = "=2.5.3"
tauri-plugin-http = { version = "=2.5.8", features = ["unsafe-headers"] }

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "=2.4.0", features = ["deep-link"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "=2.4.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "=2.10.0"
